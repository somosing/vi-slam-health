[workspace]
name = "vi-slam-health"
version = "0.3.0"
description = "ROS 2 Jazzy ORB-SLAM3 and Nav2 experiments in an isolated Pixi environment"
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-jazzy",
]
platforms = ["linux-64"]
preview = ["pixi-build"]

[activation.env]
CMAKE_INSTALL_MODE = "SYMLINK"
LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LIBRARY_PATH}"
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}"

[tasks]
build = "colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo"
build-orbslam3-adapter = "colcon build --symlink-install --packages-up-to vif_orbslam3 --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVIF_BUILD_ORB_SLAM3_ADAPTER=ON -DVIF_ORB_SLAM3_HAS_DIAGNOSTICS=ON -DORB_SLAM3_ROOT=$ORB_SLAM3_ROOT"
clean = "rm -rf build install log"
view-world = "python -m mujoco.viewer --mjcf=simulation/mujoco/worlds/long_indoor_world.xml"

[dev]
ros-jazzy-mujoco-vendor = { path = "src/third_party/mujoco_vendor/package.xml" }
ros-jazzy-mujoco-ros2-control-msgs = { path = "src/third_party/mujoco_ros2_control/mujoco_ros2_control_msgs/package.xml" }
ros-jazzy-mujoco-ros2-control = { path = "src/third_party/mujoco_ros2_control/mujoco_ros2_control/package.xml" }
ros-jazzy-mujoco-ros2-control-plugins = { path = "src/third_party/mujoco_ros2_control/mujoco_ros2_control_plugins/package.xml" }

[dependencies]
python = ">=3.11,<3.13"
cmake = ">=4.1.2,<5"
cxx-compiler = ">=2.0.0,<3"
ninja = ">=1.13.1,<2"
sccache = ">=0.11.0,<0.12"
mold = ">=2.40.2,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
colcon-mixin = ">=0.2.3,<0.3"
pkg-config = "*"
glfw = ">=3.4,<4"
libcap = ">=2.76,<3"
numpy = "*"
mujoco = "3.12.*"
opencv = "*"
eigen = "*"
pangolin-opengl = "*"
boost-cpp = "*"
openssl = "*"
open3d = "*"
ros-jazzy-ros-base = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"
ros-jazzy-octomap-server = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-controller-manager = "*"
ros-jazzy-joint-state-broadcaster = "*"
ros-jazzy-diff-drive-controller = "*"
ros-jazzy-imu-sensor-broadcaster = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-xacro = "*"
ros-jazzy-python-orocos-kdl-vendor = "*"
ros-jazzy-urdfdom-py = "*"
